/* ============================== PDF-tekstudtrækning + hash + OCR-fallback ============================== */
const TESSERACT_URL = "https://unpkg.com/tesseract.js@5.1.1/dist/tesseract.min.js";
let tesseractPromise = null;
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  if (!tesseractPromise) tesseractPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = TESSERACT_URL;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("Tesseract.js kunne ikke indlæses."));
    document.head.appendChild(s);
  });
  return tesseractPromise;
}

async function extractPdf(file, onProgress) {
  const buf = await file.arrayBuffer();
  const digest = await crypto.subtle.digest("SHA-256", buf);
  const hash = Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, "0")).join("");
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = "";
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it => it.str).join(" ") + "\n";
  }
  text = text.replace(/\s+/g, " ").trim();
  let ocr = false;
  if (text.length < 40 && pdf.numPages > 0) {
    /* Intet tekstlag (scannet PDF) — kør OCR som fallback */
    try {
      await loadTesseract();
      const worker = await Tesseract.createWorker("dan+eng", 1);
      const maxPages = Math.min(pdf.numPages, 20);
      let ocrText = "";
      for (let i = 1; i <= maxPages; i++) {
        if (onProgress) onProgress("OCR — side " + i + " af " + maxPages);
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 2 });
        const canvas = document.createElement("canvas");
        canvas.width = Math.ceil(viewport.width);
        canvas.height = Math.ceil(viewport.height);
        await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
        const { data } = await worker.recognize(canvas);
        ocrText += (data.text || "") + "\n";
      }
      await worker.terminate();
      const cleaned = ocrText.replace(/\s+/g, " ").trim();
      if (cleaned.length > text.length) { text = cleaned; ocr = true; }
    } catch (e) {
      /* OCR utilgængelig — fortsæt med det udtrukne tekstlag */
    }
  }
  if (onProgress) onProgress(null);
  return { hash, text, pages: pdf.numPages, ocr };
}

/* ============================== Relevansport ============================== */
function relevanceGate(docId, text) {
  const t = (text || "").toLowerCase();
  const signals = {
    blanket: [/(ansøgning om patent|ansøgningsnr|applicant|patent- og varemærkestyrelsen|ansøger)/i, /(opfinder|inventor)/i],
    beskrivelse: [/(opfindelse|invention|den foreliggende)/i, /(beskrivelse|description|teknisk område|technical field)/i],
    krav: [/((?:krav|claim)s?\s*\.?\s*1\b|krav|hvorledes)/i, /(kendetegnende|characterized|characterised)/i],
    sammendrag: [/(opfindelse|invention|sammendrag|abstract)/i, /(angår|relates to|omhandler|discloses)/i],
    tegninger: [/(fig\.?\s*\d|figur)/i],
  };
  const list = signals[docId] || [];
  let hits = 0;
  for (const re of list) if (re.test(t)) hits++;
  return { relevant: hits >= Math.min(2, list.length), hits, total: list.length };
}

/* ============================== Kategorispecifik tjekliste ============================== */
function runChecks(docId, text, ctx) {
  const results = [];
  const t = (text || "").toLowerCase();
  const add = (checkId, ruleId, ok, note) => results.push({ checkId, ruleId, ok, note: note || "" });
  const gate = relevanceGate(docId, text);

  if (!gate.relevant) {
    const relRule = RULES["rel_" + docId];
    if (relRule) add("relevans", "rel_" + docId, false, !text ? "Ingen tekst kunne udtrækkes — PDF'en er scannet uden tekstlag, og OCR fandt intet. " + gate.hits + " af " + gate.total + " relevanssignaler fundet." : "Kun " + gate.hits + " af " + gate.total + " relevanssignaler fundet.");
    const docDef = DOCS.find(d => d.id === docId);
    if (docDef) for (const ck of docDef.checks) {
      if (ck.id === "relevans") continue;
      add(ck.id, null, false, "Ikke vurderet — dokumentet bestod ikke relevansporten.");
    }
    return { results, gate };
  }
  add("relevans", null, true, gate.hits + " af " + gate.total + " relevanssignaler fundet.");

  if (docId === "blanket") {
    add("ansoger", "g1", /(ansøger|applicant|cvr)/i.test(t));
    const hasInventor = /(opfinder|inventor)/i.test(t);
    add("opfinder", "g2", hasInventor);
    if (hasInventor) add("erklaring", "p2", /(erklær|decl|ret til opfindelsen|acquired the right)/i.test(t));
    else add("erklaring", "p2", false, "Kan ikke vurderes — opfinder ikke angivet.");
    add("fuldmaegtig", null, true, ctx.fuldmaegtig === "ip" || ctx.fuldmaektig === "ansoger" ? "Ikke krævet (ingen anden repræsentant)." : ctx.fuldmaektig === "annen" ? "Kræves — vedlæg fuldmagt." : "Ikke krævet.");
    if (ctx.fuldmaektig === "annen") add("fuldmaegtig", "g6", false);
    if (ctx.harPrioritet) add("prioritet", "p8", /(prioritetsdokument|priority document|das|prioritet)/i.test(t));
    else add("prioritet", null, true, "Ingen prioritet påberåbt.");
    add("paBlanket", null, /(ansøgning om patent|patent- og varemærkestyrelsen|referencenummer)/i.test(t), "Strukturgenkendelse af PA-blanket.");
  }
  if (docId === "beskrivelse") {
    add("tekstlag", "g3", !!(text && text.length >= 50));
    add("titel", null, /(titel|title:|opfindelsens titel)/i.test(t) || /"([^"]{5,80})"/.test(t), "Titelfelt eller citeret titel søgt.");
    const figRefs = (text || "").match(/fig\.?\s*\d+/gi) || [];
    ctx.figRefs = figRefs.length;
    add("figHenvisning", "g7", !(figRefs.length > 0 && !ctx.hasTegninger && ctx.tegningerUploaded === false), figRefs.length > 0 ? figRefs.length + " figurhenvisninger fundet." + (ctx.hasTegninger ? "" : " Tegninger ikke uploadet.") : "Ingen figurhenvisninger — ok hvis opfindelsen ikke kræver tegninger.");
    if (figRefs.length > 0 && !ctx.hasTegninger) add("figHenvisning", "g7", false, "Beskrivelsen henviser til tegninger, der ikke er uploadet.");
  }
  if (docId === "krav") {
    const nums = (text || "").match(/(?:krav|claim)\s*\.?\s*(\d+)/gi) || [];
    const parsed = nums.map(s => parseInt(s.replace(/\D+/g, ""), 10)).filter(n => !isNaN(n));
    const unique = [...new Set(parsed)];
    add("mindstEt", "g4", parsed.length > 0, parsed.length > 0 ? "Fundet krav nr. 1–" + Math.max(...parsed) + "." : "Ingen nummererede krav fundet.");
    add("nummerering", "p4", parsed.length === 0 || unique.length === parsed.length, parsed.length > 0 ? parsed.length + " kravsnumre fundet, " + unique.length + " unikke." : "");
    ctx.claimsInDoc = parsed.length > 0 ? Math.max(...parsed) : 0;
    add("antal", null, true, ctx.claimsInDoc + " krav i dokumentet (til gebyropgørelse).");
  }
  if (docId === "sammendrag") {
    const words = (text || "").split(/\s+/).filter(Boolean).length;
    add("findes", "g5", !!(text && text.length >= 30), words + " ord læst.");
    add("ordgraense", "p6", words > 0 && words <= 150, words + " ord (maks. 150).");
  }
  if (docId === "tegninger") {
    add("figNumre", null, /fig\.?\s*\d+/i.test(t));
    add("ingenTekst", null, (text || "").split(/\s+/).filter(Boolean).length < 80, "Tegninger bør indeholde få ord (signaturforklaring er ok).");
    add("fotosPersoner", "p5", !/(foto|billede|photograph|photo)/i.test(t));
  }
  return { results, gate };
}

/* ============================== Auto-detektering af ansøgningsdata ============================== */
function detectSprog(text) {
  const t = " " + (text || "").toLowerCase() + " ";
  const c = re => (t.match(re) || []).length;
  const scores = {
    dansk: c(/\b(og|den|det|hvori|kendetegnende|opfindelsen|hvorledes|eller|vedrørende)\b/g),
    engelsk: c(/\b(the|of|wherein|characterized|characterised|invention|according|and)\b/g),
    tysk: c(/\b(der|die|das|und|wobei|gekennzeichnet|erfindung|anspruch)\b/g),
    fransk: c(/\b(l'invention|caractéris|la présente|revendication|dans laquelle)\b/g),
  };
  let best = "ukendt", bs = 0;
  for (const k of Object.keys(scores)) if (scores[k] > bs) { bs = scores[k]; best = k; }
  return best;
}

/* ============================== Score ============================== */
function computeScore(mangler, advarsler) {
  return Math.max(1, Math.min(10, 10 - mangler * 2 - advarsler));
}
function scoreVerdict(score) {
  if (score >= 9) return "Klar til indgivelse";
  if (score >= 7) return "Næsten klar — få ting skal rettes";
  if (score >= 4) return "Ikke klar — flere mangler skal rettes";
  return "Langt fra klar — gennemgå alle mangler";
}

/* ============================== PDF-eksport af rapporten ============================== */
function exportReport({ score, verdict, findings, checks, gebyr, kravAntal, docFiles, ansogData }) {
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  let body = "";
  body += "<h1>PatentScreen — screeningsrapport</h1>";
  body += "<p>Dato: " + new Date().toLocaleDateString("da-DK") + " · Score: " + score + "/10 — " + esc(verdict) + "</p>";
  body += "<p>Screenet jf. PA Guidelines – Formalitetsbehandling og intern procedure FSP 3.2.2 (v40).</p>";
  if (ansogData) body += "<h2>Ansøgningsdata</h2><p>" + esc(ansogData) + "</p>";

  body += "<h2>Detaljeret gennemgang pr. bilag</h2>";
  for (const d of DOCS) {
    const st = docFiles[d.id];
    body += "<h3>" + esc(d.label) + (st && st.file ? " (" + esc(st.file.name) + ")" : " (ikke uploadet)") + "</h3>";
    const rows = (checks[d.id] || []).map(c => {
      const status = c.ok ? "OK" : (RULES[c.ruleId] ? (RULES[c.ruleId].sev === "mangler" ? "MANGEL" : "ADVARSEL") : "—");
      return "<tr><td>" + esc(c.checkId) + "</td><td>" + esc(Object.values(DOCS.find(x => x.id === d.id).checks).length ? "" : "") + esc(labelOf(d, c.checkId)) + "</td><td>" + status + "</td><td>" + esc(c.note) + "</td></tr>";
    }).join("");
    body += "<table><tr><th>Tjek</th><th>Element</th><th>Status</th><th>Bemærkning</th></tr>" + rows + "</table>";
  }

  body += "<h2>Fund med henvisninger</h2>";
  for (const f of findings) {
    body += "<p><b>" + esc(f.rule) + "</b> (" + esc(f.doc) + ") — " + esc(f.sev) + (f.henlaeggelse ? " — henlæggelse ved manglende svar" : "") + "<br/>" + esc(f.detail) + "<br/>Henvisning: " + esc(f.ref) + " · " + esc(f.source === "guidelines" ? "Guidelines" : "Intern procedure") + (f.fmBrev ? " · " + esc(f.fmBrev) : "") + "</p>";
  }
  body += "<h2>Gebyropgørelse</h2>";
  body += "<p>Grundgebyr 3.000 kr." + (kravAntal > 10 ? " + kravgebyr " + (kravAntal - 10) + " × 300 kr." : "") + " = " + gebyr.toLocaleString("da-DK") + " kr. ved " + kravAntal + " krav. (Betalingsverifikation foretages i Easyflow.)</p>";

  const html = "<html><head><meta charset='utf-8'><title>PatentScreen-rapport</title><style>body{font-family:sans-serif;margin:30px}h1{color:#122b4a}h2{color:#1c3f6e;border-bottom:1px solid #ccc;padding-bottom:4px}h3{margin-bottom:2px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid #ccc;padding:4px 8px;text-align:left}td:nth-child(3){font-weight:bold}</style></head><body>" + body + "</body></html>";
  const blob = new Blob([html], { type: "application/pdf" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "patentscreen-rapport.html";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

function labelOf(doc, checkId) {
  const c = (doc.checks || []).find(x => x.id === checkId);
  return c ? c.label : checkId;
}

/* ============================== UI ============================== */
function fmtSize(n) {
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}
function Badge({ tone, children }) {
  const tones = {
    ok: "bg-[#1a7f4b] text-white", err: "bg-[#c0392b] text-white",
    warn: "bg-amber-100 text-[#b26a00] border border-amber-300",
    outline: "border border-[#1c3f6e] text-[#1c3f6e]",
    neutral: "bg-white border border-slate-300 text-slate-500",
    proc: "border border-slate-400 text-slate-500",
    henl: "border border-[#c0392b] bg-red-50 text-[#c0392b]",
    req: "bg-white border border-[#c0392b] text-[#c0392b]",
    optional: "bg-slate-200 text-slate-600",
  };
  return <span className={"inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium " + tones[tone]}>{children}</span>;
}

function App() {
  const [view, setView] = useState("indlevering");
  const [docState, setDocState] = useState({});
  const [dupMsg, setDupMsg] = useState(null);
  const [rapportEnabled, setRapportEnabled] = useState(false);
  const [busy, setBusy] = useState(false);

  const setDoc = useCallback((id, patch) => {
    setDocState(prev => ({ ...prev, [id]: { ...prev[id], ...patch } }));
    setRapportEnabled(false);
  }, []);

  async function handleFile(docId, file) {
    if (!file) return;
    setDupMsg(null);
    setDoc(docId, { file: { name: file.name, size: file.size }, reading: true, ocr: false, ocrStatus: null });
    try {
      const { hash, text, pages, ocr } = await extractPdf(file, msg => setDoc(docId, { ocrStatus: msg }));
      const other = Object.entries(docState).find(([id, st]) => id !== docId && st && st.hash === hash);
      if (other) {
        setDupMsg("Filen '" + file.name + "' er identisk med filen under '" + DOCS.find(d => d.id === other[0]).label + "'. Samme dokument må ikke uploades i flere kategorier.");
        setDoc(docId, { reading: false, dup: true });
        return;
      }
      setDoc(docId, { reading: false, hash, text, pages, dup: false, ocr, ocrStatus: null });
    } catch {
      setDoc(docId, { reading: false, hash: null, text: "", pages: 0, dup: false });
    }
  }

  const uploaded = DOCS.filter(d => docState[d.id]?.file).length;
  const requiredMissing = DOCS.filter(d => d.req && !docState[d.id]?.file).length;

  function screen() {
    setBusy(true);
    setTimeout(() => { setBusy(false); setRapportEnabled(true); setView("rapport"); }, 600);
  }

  /* --- Screening: relevansport + tjeklister pr. kategori --- */
  const allText = DOCS.map(d => docState[d.id]?.text || "").join(" ");
  const blanketText = docState.blanket?.text || "";
  const detSprog = detectSprog(allText);
  const detFuldmaektig = /(ip[- ]rådgiver|autoriseret patent|rådgiver i patenter)/i.test(blanketText) ? "ip" : /(fuldm[æa]gtig|repræsentant|representative|agent|advokat)/i.test(blanketText) ? "annen" : "ansoger";
  const detPrioritet = /(prioritet|priority|prioritetsdato)/i.test(blanketText);
  const detSekvenser = /(sekvensliste|sequence listing|sekvens-id|seq\s*id|st\.?\s*26)/i.test(allText);
  const ctx = { fuldmaektig: detFuldmaektig, harPrioritet: detPrioritet, hasTegninger: !!docState.tegninger?.file, claimsInDoc: 0, figRefs: 0 };
  const checks = {};
  const findings = [];
  const seenIds = new Set();
  const pushFinding = f => { const key = f.rule || f.id; if (!seenIds.has(key)) { seenIds.add(key); findings.push(f); } };
  for (const d of DOCS) {
    const st = docState[d.id];
    if (d.req && !st?.file) {
      const map = { blanket: "g1", beskrivelse: "g3", krav: "g4", sammendrag: "g5" };
      const r = RULES[map[d.id]];
      findings.push({ ...r, id: r.id + "-m", detail: r.detail + " (Bilag ikke uploadet.)" });
      checks[d.id] = [{ checkId: "uploadet", ruleId: map[d.id], ok: false, note: "Påkrævet bilag mangler." }];
    } else if (st?.file && !st.dup) {
      const { results } = runChecks(d.id, st.text, ctx);
      checks[d.id] = results;
      for (const r of results) {
        if (!r.ok && r.ruleId) pushFinding(RULES[r.ruleId]);
      }
      const allOk = results.every(r => r.ok);
      if (allOk && d.checks.length > 0) findings.push({ id: "ok-" + d.id, sev: "ok", doc: d.label, rule: d.label + " — alle tjek bestået", detail: "Alle " + d.checks.length + " elementer i tjeklisten er kontrolleret og godkendt.", fix: "", source: "guidelines", ref: "PA Guidelines · Formalitetsbehandling" });
    } else if (st?.dup) {
      findings.push(RULES.dup);
    }
  }
  if (detSprog === "tysk" || detSprog === "fransk") pushFinding(RULES.p3);
  if (detFuldmaektig === "annen") pushFinding(RULES.g6);
  if (detSekvenser) pushFinding(RULES.p7);
  const kravAntal = ctx.claimsInDoc || 0;
  const gebyr = 3000 + Math.max(0, kravAntal - 10) * 300;

  const mangler = findings.filter(f => f.sev === "mangler");
  const advarsler = findings.filter(f => f.sev === "advarsel");
  const okFinds = findings.filter(f => f.sev === "ok");
  const henlMangler = mangler.filter(f => f.henlaeggelse);
  const score = computeScore(mangler.length, advarsler.length);


  function DocCard({ doc }) {
    const st = docState[doc.id] || {};
    const hasFile = !!st.file;
    const docChecks = checks[doc.id] || [];
    const fails = docChecks.filter(c => !c.ok);
    const border = st.dup ? "border-l-[#c0392b]" : fails.length > 0 ? "border-l-[#b26a00]" : hasFile ? "border-l-[#1a7f4b]" : "border-l-slate-300";
    const badge = !hasFile
      ? (doc.req ? <Badge tone="req">Påkrævet</Badge> : <Badge tone="optional">Valgfri</Badge>)
      : st.dup ? <Badge tone="err">Duplikat</Badge>
      : st.reading ? <Badge tone="neutral">{st.ocrStatus ? "OCR kører …" : "Læser …"}</Badge>
      : fails.length === 0 ? <Badge tone="ok">I orden</Badge>
      : <Badge tone="warn">{fails.length} fund</Badge>;

    return (
      <div className={"rounded-lg border border-slate-200 border-l-4 bg-white p-4 " + border}>
        <div className="flex items-start justify-between gap-3">
          <div className="min-w-0 flex-1">
            <div className="flex flex-wrap items-center gap-2 text-sm font-semibold text-slate-800">
              {doc.label} {badge}
            </div>
            <p className="mt-1 text-xs text-slate-500">{doc.desc}</p>
            {hasFile && (
              <p className="mt-2 text-xs text-slate-500">
                {st.file.name} · {fmtSize(st.file.size)}{st.pages ? " · " + st.pages + " sider" : ""}{st.reading ? (st.ocrStatus ? " · " + st.ocrStatus : " · læser …") : (st.text ? " · " + st.text.split(/\s+/).length + " ord" : " · intet tekstlag")}{!st.reading && st.ocr ? " · tekst via OCR" : ""}
              </p>
            )}
            {hasFile && !st.reading && !st.dup && doc.checks.length > 0 && (
              <div className="mt-2 rounded-md bg-slate-50 p-2">
                <p className="mb-1 text-xs font-semibold text-slate-600">Tjekliste ({docChecks.filter(c => c.ok).length}/{doc.checks.length} ok):</p>
                <ul className="space-y-1">
                  {doc.checks.map(ck => {
                    const st2 = docChecks.find(c => c.checkId === ck.id);
                    const ok = st2 ? st2.ok : false;
                    return (
                      <li key={ck.id} className="text-xs text-slate-600">
                        <span className={ok ? "text-[#1a7f4b]" : "text-[#c0392b]"}>{ok ? "✓" : "✕"}</span> {ck.label}
                        {st2 && st2.note && <span className="text-slate-400"> — {st2.note}</span>}
                      </li>
                    );
                  })}
                </ul>
              </div>
            )}
            {st.dup && <p className="mt-2 rounded bg-red-50 px-2 py-1 text-xs text-[#c0392b]">{dupMsg}</p>}
          </div>
          <div className="w-32 shrink-0 space-y-1.5">
            <label className="block">
              <input type="file" accept="application/pdf,.pdf" className="hidden"
                onChange={(e) => { handleFile(doc.id, e.target.files[0]); e.target.value = ""; }} />
              <span className="inline-block w-full cursor-pointer rounded-md border border-slate-300 bg-white px-2 py-1 text-center text-xs hover:bg-slate-50">
                {hasFile ? "Erstat fil" : "Vælg PDF"}
              </span>
            </label>
            {hasFile && (
              <button className="w-full rounded-md border border-slate-300 bg-white px-2 py-1 text-xs hover:bg-slate-50"
                onClick={() => setDoc(doc.id, { file: undefined, text: undefined, hash: undefined, pages: 0, dup: false, ocr: false, ocrStatus: null })}>
                Fjern fil
              </button>
            )}
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen p-6">
      <div className="mx-auto max-w-3xl space-y-4">
        <div className="flex items-center justify-between">
          <div>
            <h1 className="text-lg font-bold text-[#122b4a]">PatentScreen</h1>
            <p className="text-xs text-slate-500">Duplikatkontrol · relevansport · tjeklister pr. kategori · PDF-eksport</p>
          </div>
          <div className="flex rounded-md border border-slate-200 bg-white p-1 text-xs">
            <button className={"rounded px-3 py-1 " + (view === "indlevering" ? "bg-[#1c3f6e] text-white" : "text-slate-500")} onClick={() => setView("indlevering")}>1 · Indlevering</button>
            <button className={"rounded px-3 py-1 " + (view === "rapport" ? "bg-[#1c3f6e] text-white" : rapportEnabled ? "text-slate-500" : "cursor-not-allowed text-slate-300")}
              onClick={() => rapportEnabled && setView("rapport")} title={rapportEnabled ? "" : "Tryk 'Screen og fortsæt' for at se rapporten"}>
              2 · Rapport {!rapportEnabled && "🔒"}
            </button>
          </div>
        </div>

        {view === "indlevering" ? (
          <div className="space-y-4">
            <div className="rounded-lg bg-[#122b4a] p-5 text-white">
              <p className="text-xs uppercase tracking-wider text-white/60">Patent- og Varemærkestyrelsen · E-filing · Patentansøgning</p>
              <h2 className="mt-1 text-xl font-semibold">Ny indlevering — upload og screening</h2>
              <p className="mt-1 text-xs text-white/60">Hvert bilag gennemgår duplikatkontrol, relevansport og en fast tjekliste. Ved tvivl gælder guidelines.</p>
            </div>

            <div className="flex items-center gap-3 text-sm">
              <span className="font-medium text-slate-700">{uploaded} af {DOCS.length} bilag</span>
              <div className="h-2 w-48 overflow-hidden rounded bg-slate-200">
                <div className="h-full bg-[#1a7f4b]" style={{ width: (uploaded / DOCS.length) * 100 + "%" }} />
              </div>
              {requiredMissing > 0 && <span className="text-xs text-[#c0392b]">{requiredMissing} påkrævede bilag mangler</span>}
            </div>

            {dupMsg && (
              <div className="rounded-md border border-[#c0392b] bg-red-50 px-3 py-2 text-xs text-[#c0392b]">{dupMsg}</div>
            )}

            <div className="space-y-3">
              {DOCS.map(d => <DocCard key={d.id} doc={d} />)}
            </div>

            <div className="flex items-center justify-end gap-4 rounded-lg border border-slate-200 bg-white p-4">
              <p className="mr-auto text-xs text-slate-500">Duplikatkontrol, relevansport og tjeklister kører ved upload. Ved tvivl gælder guidelines.</p>
              <button className="rounded-md border border-slate-300 bg-white px-4 py-2 text-sm hover:bg-slate-50">Gem kladde</button>
              <button disabled={requiredMissing > 0 || busy} onClick={screen}
                className="rounded-md bg-[#1c3f6e] px-4 py-2 text-sm text-white hover:bg-[#122b4a] disabled:opacity-50">
                {busy ? "Screener …" : "Screen og fortsæt →"}
              </button>
            </div>
          </div>
        ) : (
          <div className="space-y-4">
            <div className="overflow-hidden rounded-lg bg-gradient-to-br from-[#1c3f6e] to-[#122b4a] p-6 text-white">
              <div className="flex flex-col gap-4 md:flex-row md:items-center">
                <div className="flex h-24 w-24 shrink-0 flex-col items-center justify-center rounded-full border-4 border-white/30">
                  <span className="text-2xl font-bold">{score}<span className="text-sm text-white/70">/10</span></span>
                </div>
                <div className="flex-1">
                  <h2 className="text-xl font-semibold">{scoreVerdict(score)}</h2>
                  <p className="mt-1 text-sm text-white/80">
                    {mangler.length === 1 ? "1 formel mangel" : mangler.length + " formelle mangler"} og {advarsler.length === 1 ? "1 advarsel" : advarsler.length + " advarsler"} fundet.
                    {henlMangler.length > 0 ? " " + henlMangler.length + " af manglerne medfører henlæggelse ved manglende svar (pkt. 9.1)." : ""}
                    {" "}Ved tvivl gælder guidelines.
                  </p>
                  <div className="mt-3 flex gap-2 text-xs">
                    <span className="rounded-full bg-[#c0392b] px-3 py-1">{mangler.length} mangler</span>
                    <span className="rounded-full bg-[#b26a00] px-3 py-1">{advarsler.length} advarsler</span>
                    <span className="rounded-full bg-[#1a7f4b] px-3 py-1">{okFinds.length} godkendt</span>
                  </div>
                </div>
              </div>
            </div>

            <div className="rounded-lg border border-slate-200 bg-white p-4">
              <h3 className="text-sm font-semibold text-[#1c3f6e]">Ansøgningsdata — udtrukket af screeningen</h3>
              <div className="mt-2 grid grid-cols-1 gap-2 text-xs text-slate-600 md:grid-cols-2">
                <p><span className="font-semibold text-slate-700">Sprog:</span> {detSprog}</p>
                <p><span className="font-semibold text-slate-700">Indgives via:</span> {detFuldmaektig === "ip" ? "IP-rådgiver" : detFuldmaektig === "annen" ? "Anden repræsentant (fuldmagt kræves)" : "Ansøger selv"}</p>
                <p><span className="font-semibold text-slate-700">Prioritet påberåbt:</span> {detPrioritet ? "Ja" : "Nej"}</p>
                <p><span className="font-semibold text-slate-700">Sekvenser:</span> {detSekvenser ? "Ja — XML jf. ST.26 kræves" : "Nej"}</p>
                <p><span className="font-semibold text-slate-700">Antal patentkrav:</span> {kravAntal}</p>
              </div>
            </div>

            {(mangler.length > 0 || advarsler.length > 0) && (
              <div className="rounded-lg border-2 border-[#1c3f6e]/30 bg-white p-4">
                <h3 className="text-base font-semibold text-[#1c3f6e]">Hvad skal du rette — i rækkefølge</h3>
                <p className="text-xs text-slate-500">Start øverst. Mangler skal rettes, før ansøgningen kan indgives.</p>
                <ol className="mt-3 space-y-2">
                  {[...mangler, ...advarsler].map((f, i) => (
                    <li key={f.id + i} className="flex items-start gap-3 rounded-md bg-slate-50 px-3 py-2">
                      <span className={"mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full text-[10px] font-bold text-white " + (f.sev === "mangler" ? "bg-[#c0392b]" : "bg-[#b26a00]")}>{i + 1}</span>
                      <div>
                        <p className="text-sm text-slate-800">{f.fix}</p>
                        <p className="text-xs text-slate-400">{f.doc} · {f.rule}</p>
                      </div>
                    </li>
                  ))}
                </ol>
              </div>
            )}

            <div className="rounded-lg border border-slate-200 border-l-4 border-l-[#1a7f4b] bg-white p-4">
              <h3 className="text-sm font-semibold text-[#1a7f4b]">Hvad er allerede i orden</h3>
              <ul className="mt-2 space-y-1 text-sm text-slate-700">
                {okFinds.length === 0 && <li className="text-xs text-slate-400">Ingen bilag fuldt godkendt endnu.</li>}
                {okFinds.map(f => <li key={f.id}>✓ {f.rule} <span className="text-xs text-slate-400">({f.doc})</span></li>)}
              </ul>
            </div>

            <h3 className="pt-1 text-sm font-semibold text-slate-800">Detaljeret gennemgang pr. bilag</h3>
            {DOCS.map(d => {
              const rows = checks[d.id] || [];
              const st = docState[d.id];
              return (
                <div key={d.id} className="rounded-lg border border-slate-200 bg-white p-4">
                  <div className="flex items-center justify-between">
                    <span className="text-sm font-semibold text-slate-800">{d.label}{st?.file ? " — " + st.file.name : ""}</span>
                    {d.req && !st?.file && <Badge tone="req">Mangler</Badge>}
                    {rows.length > 0 && rows.every(r => r.ok) && <Badge tone="ok">Alle tjek bestået</Badge>}
                    {rows.some(r => !r.ok) && <Badge tone="warn">Se fund</Badge>}
                  </div>
                  {rows.length > 0 ? (
                    <table className="mt-2 w-full text-xs">
                      <tr className="text-slate-400"><td className="py-1">Tjek</td><td>Status</td><td>Bemærkning</td></tr>
                      {rows.map((r, i) => {
                        const label = labelOf(d, r.checkId);
                        const sev = r.ok ? "ok" : (RULES[r.ruleId] ? RULES[r.ruleId].sev : (r.note.indexOf("Ikke vurderet") === 0 ? "uvidst" : "advarsel"));
                        return (
                          <tr key={i} className="border-t border-slate-100">
                            <td className="py-1 pr-2 text-slate-700">{label}</td>
                            <td className="pr-2"><span className={r.ok ? "text-[#1a7f4b]" : sev === "mangler" ? "text-[#c0392b] font-semibold" : sev === "uvidst" ? "text-slate-400" : "text-[#b26a00] font-semibold"}>{r.ok ? "OK" : (sev === "mangler" ? "Mangel" : sev === "uvidst" ? "Ikke vurderet" : "Advarsel")}</span></td>
                            <td className="text-slate-500">{r.note}</td>
                          </tr>
                        );
                      })}
                    </table>
                  ) : (
                    <p className="mt-2 text-xs text-slate-400">{d.checks.length === 0 ? "Ingen tjekliste for denne kategori." : "Ingen fil uploadet."}</p>
                  )}
                </div>
              );
            })}

            {[...mangler, ...advarsler].length > 0 && (
              <>
                <h3 className="pt-1 text-sm font-semibold text-slate-800">Fund med henvisninger</h3>
                {[...mangler, ...advarsler].map((f, i) => (
                  <div key={f.id + i} className={"rounded-lg border border-slate-200 border-l-4 bg-white p-4 " + (f.sev === "mangler" ? "border-l-[#c0392b]" : "border-l-[#b26a00]")}>
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <span className="text-sm font-semibold text-slate-800">{f.rule}</span>
                      <div className="flex shrink-0 flex-wrap items-center gap-2">
                        {f.henlaeggelse && <Badge tone="henl">Henlæggelse ved manglende svar</Badge>}
                        {f.fmBrev && <Badge tone="neutral">→ {f.fmBrev}</Badge>}
                        <Badge tone={f.source === "guidelines" ? "outline" : "proc"}>{f.source === "guidelines" ? "Guidelines" : "Intern procedure"}</Badge>
                        <Badge tone={f.sev === "mangler" ? "err" : "warn"}>{f.sev === "mangler" ? "Mangel" : "Advarsel"}</Badge>
                      </div>
                    </div>
                    <p className="mt-1 text-xs text-slate-500">{f.doc}</p>
                    <p className="mt-2 text-sm text-slate-700">{f.detail}</p>
                    <div className="mt-2 rounded-md bg-slate-50 px-3 py-2">
                      <p className="text-xs text-slate-600">
                        <span className="font-semibold text-[#1c3f6e]">Henvisning:</span> {f.ref}
                        {f.source === "procedure" && <span className="ml-1 text-slate-400">(Ved tvivl gælder PA Guidelines.)</span>}
                      </p>
                    </div>
                  </div>
                ))}
              </>
            )}

            <div className="rounded-lg border border-slate-200 border-l-4 border-l-slate-400 bg-white p-4">
              <div className="flex items-center justify-between gap-2">
                <span className="text-sm font-semibold text-slate-800">Gebyropgørelse</span>
                <Badge tone="neutral">Opgørelse</Badge>
              </div>
              <p className="mt-2 text-sm text-slate-700">
                Grundgebyr 3.000 kr.{kravAntal > 10 ? " + kravgebyr " + (kravAntal - 10) + " × 300 kr." : ""} = <span className="font-semibold">{gebyr.toLocaleString("da-DK")} kr.</span> ved {kravAntal} krav.
              </p>
              <div className="mt-2 rounded-md bg-slate-50 px-3 py-2">
                <p className="text-xs text-slate-600">
                  <span className="font-semibold text-[#1c3f6e]">Henvisning:</span> FSP 3.2.2 pkt. 7.1
                  <span className="ml-1 text-slate-400">(Betalingsverifikation foretages i Easyflow og indgår ikke i screeningen.)</span>
                </p>
              </div>
            </div>

            <div className="flex items-center justify-between pb-2">
              <p className="text-xs text-slate-400">Screenet jf. PA Guidelines – Formalitetsbehandling og intern procedure FSP 3.2.2 (v40)</p>
              <div className="space-x-2">
                <button className="rounded-md border border-slate-300 bg-white px-3 py-1.5 text-xs hover:bg-slate-50"
                  onClick={() => exportReport({ score, verdict: scoreVerdict(score), findings: [...mangler, ...advarsler], checks, gebyr, kravAntal, docFiles: docState, ansogData: "Sprog: " + detSprog + " · Indgives via: " + (detFuldmaektig === "ip" ? "IP-rådgiver" : detFuldmaektig === "annen" ? "Anden repræsentant" : "Ansøger selv") + " · Prioritet: " + (detPrioritet ? "Ja" : "Nej") + " · Sekvenser: " + (detSekvenser ? "Ja" : "Nej") + " · Antal krav: " + kravAntal })}>
                  Eksportér rapport
                </button>
                <button className="rounded-md bg-[#1c3f6e] px-3 py-1.5 text-xs text-white hover:bg-[#122b4a]" onClick={() => setView("indlevering")}>Ret og screen igen</button>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
